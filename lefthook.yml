pre-commit:
  parallel: false
  commands:
    lint:
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}'
      run: pnpm oxlint {staged_files}
    format:
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,astro,md,mdx,json,jsonc,json5,yml,yaml,toml,css,scss,less,html,vue,svelte,graphql,gql}'
      run: pnpm oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

remotes:
  - git_url: https://github.com/boozt-platform/lefthook.git
    ref: v1.3.0
    configs:
      - hooks/commitlint/.lefthook.yaml
